# Kodi SPA -- deep links fall back to index.html; hashed assets cache for a year.
# The ops console (apps/console) rides along at /console/ in this same
# container: its dist is copied to /usr/share/nginx/html/console, and its
# relative-base build resolves assets under any path prefix.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /console/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /console/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /console/index.html;
    }

    location = /console {
        return 301 /console/;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
