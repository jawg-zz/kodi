# Kodi on Dokploy (compose service, source: repo ./docker-compose.yml).
# The web image is built server-side by Dokploy; VITE_* values come from
# build args set in the Dokploy dashboard (mirrored from env below).
# Dokploy note: every VITE_* arg must ALSO be added as a build arg in the
# Dokploy dashboard for the web service — dashboard env vars alone are NOT
# baked into the Vite bundle (Vite inlines them at build time).
name: kodi

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL:?VITE_CONVEX_URL is required}
        VITE_LOGTO_ISSUER: ${VITE_LOGTO_ISSUER:?VITE_LOGTO_ISSUER is required}
        VITE_LOGTO_APP_ID: ${VITE_LOGTO_APP_ID:?VITE_LOGTO_APP_ID is required}
        VITE_APP_URL: ${VITE_APP_URL:-}
    restart: unless-stopped
